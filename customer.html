<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Customer Dashboard</title>
    <link href='https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css' rel='stylesheet'>
    <style>
        body {
            background: linear-gradient(135deg, #f8f9fa 0%, #eef3ff 100%);
            min-height: 100vh;
            font-family: Arial, sans-serif;
            padding: 40px 0;
        }

        .dashboard-container {
            max-width: 1100px;
            margin: 0 auto;
        }

        .section-card {
            border: none;
            border-radius: 18px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.08);
        }

        .menu-card .card-header {
            background: linear-gradient(135deg, #0d6efd, #0b5ed7);
            color: white;
            border-bottom: none;
            padding: 1.2rem 1.5rem;
        }

        .menu-item {
            border: 1px solid #e9ecef;
            border-radius: 12px;
            padding: 1rem 1.1rem;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
        }

        .food-image {
            width: 86px;
            height: 70px;
            object-fit: cover;
            border-radius: 10px;
            flex-shrink: 0;
        }

        .order-list {
            list-style: none;
            padding-left: 0;
            margin: 0;
        }

        .order-item {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 10px;
            padding: 0.8rem 1rem;
            margin-bottom: 0.75rem;
        }

        .order-item .btn {
            border-radius: 8px;
            font-weight: 600;
            padding: 0.45rem 0.8rem;
        }

        .btn-primary {
            border-radius: 10px;
            padding: 0.6rem 1rem;
            font-weight: 600;
        }

        .logout-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 2;
        }
        .order-heading {
            margin: 0 0 1rem;
            color: #212529;
            font-size: 1.5rem;
            font-weight: 700;
        }

        .cart-item {
            border-bottom: 1px solid #e9ecef;
            padding: 0.75rem 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
        }

        .cart-item:last-child {
            border-bottom: none;
        }

        .cart-item .btn {
            width: 30px;
            height: 30px;
            padding: 0;
        }
    </style>
</head>
<body>
    <button class='btn btn-outline-danger logout-btn' id='logoutBtn'>Logout</button>

    <div class='dashboard-container container'>
        <div class='row g-4'>
            <div class='col-lg-8'>
                <div class='card section-card menu-card'>
                    <div class='card-header'>
                        <h3 class='mb-0'>Food Menu</h3>
                    </div>
                    <div class='card-body'>
                        <div align='center' id='welcomeMessage' class='mb-3 text-primary fw-semibold'></div>

                        <h2 align='center' class='order-heading'>Order now and enjoy!</h2>

                        <div id='menu'></div>
                    </div>
                </div>
            </div>

            <div class='col-lg-4'>
                <div class='card section-card'>
                    <div class='card-header bg-success text-white'>
                        <h4 class='mb-0'>Cart (<span id='cartCount'>0</span>)</h4>
                    </div>
                    <div class='card-body'>
                        <div id='cart'></div>
                        <div class='d-flex justify-content-between fw-bold border-top mt-3 pt-3'>
                            <span>Total</span>
                            <span id='cartTotal'>₹0</span>
                        </div>
                        <button id='checkoutButton' class='btn btn-success w-100 mt-3' onclick='checkout()' disabled>Proceed to Pay</button>
                        <div id='checkoutMessage' class='alert alert-success mt-3 mb-0' role='alert' hidden>Order placed successfully!</div>
                    </div>
                </div>

                <div class='card section-card mt-4'>
                    <div class='card-header bg-dark text-white'>
                        <h4 class='mb-0'>My Orders</h4>
                    </div>
                    <div class='card-body'>
                        <ul id='orders' class='order-list'></ul>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src='customer.js?v=2'></script>
</body>
</html>
