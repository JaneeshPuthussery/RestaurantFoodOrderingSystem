<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Login</title>

    <link href='https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css' rel='stylesheet'>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000307;
            font-family: Arial, sans-serif;
        }

        .login-card {
            width: 100%;
            max-width: 1700px;
            height: min(820px, calc(100vh - 40px));
            overflow: hidden;
            border-radius: 18px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, .35);
        }

        .login-layout {
            display: flex;
            width: 100%;
            height: 100%;
        }

        .login-image {
            flex: 1;
            min-width: 0;
            overflow: hidden;
            background: #111;
        }

        .login-image img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
            transition: transform .5s ease;
        }

        .login-image:hover img {
            transform: scale(1.04);
        }

        .login-form {
            width: 420px;
            flex-shrink: 0;
            overflow-y: auto;
            background: linear-gradient(180deg, #ffffff, #f8faff);
        }

        .card-header {
            padding: 0;
            border: 0;
            background: linear-gradient(135deg, #0d6efd, #d70bb8);
        }

        .nav-tabs {
            border: 0;
        }

        .nav-tabs .nav-item {
            width: 50%;
        }

        .nav-tabs .nav-link {
            width: 100%;
            padding: 1.1rem .5rem;
            color: #fff;
            border: 0;
            border-radius: 0;
            font-size: 1.1rem;
            font-weight: 600;
        }

        .nav-tabs .nav-link.active {
            color: #fff;
            background: rgba(255, 255, 255, .2);
        }

        .card-body {
            padding: 2.5rem 2rem;
        }

        .welcome-text {
            margin-bottom: 2rem;
            text-align: center;
        }

        .welcome-text h2 {
            margin: 0 0 .5rem;
            color: #1f2937;
            font-size: 2rem;
            font-weight: 700;
        }

        .welcome-text p {
            margin: 0;
            color: #6b7280;
            font-size: 1rem;
        }

        .form-label {
            margin-bottom: .5rem;
            color: #374151;
            font-size: 1rem;
            font-weight: 600;
        }

        .form-control {
            min-height: 52px;
            padding: .85rem;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            background: #f8f9fa;
            transition: .2s ease;
        }

        .form-control:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, .15);
        }

        .btn-primary,
        .btn-reset {
            min-height: 52px;
            border-radius: 10px;
            font-weight: 600;
            transition: .2s ease;
        }

        .btn-primary {
            background: #0d6efd;
            border-color: #0d6efd;
        }

        .btn-primary:hover {
            background: #095dcc;
            border-color: #095dcc;
            transform: translateY(-2px);
        }

        .btn-reset {
            color: #da0b0b;
            border: 1px solid #da0b0b;
            background: #fff;
        }

        .btn-reset:hover {
            color: #fff;
            background: #da0b0b;
            transform: translateY(-2px);
        }

        a {
            color: #0d6efd;
            font-weight: 600;
        }

        @media (max-width: 900px) {
            body {
                padding: 10px;
            }

            .login-card {
                height: auto;
            }

            .login-layout {
                flex-direction: column;
            }

            .login-image,
            .login-form {
                width: 100%;
            }

            .login-image {
                height: 220px;
                flex: none;
            }

            .login-form {
                overflow: visible;
            }

            .card-body {
                padding: 2rem 1.25rem;
            }
        }
    </style>
</head>

<body>
    <main class='login-card'>
        <div class='login-layout'>

            <div class='login-image'>
                <img src='images/food-login.jpg' alt='Food image'>
            </div>

            <div class='login-form'>
                <div class='card-header'>
                    <ul class='nav nav-tabs nav-fill'>
                        <li class='nav-item'>
                            <button type='button'
                                    class='nav-link active'
                                    data-bs-toggle='tab'
                                    data-bs-target='#customer'>
                                Customer
                            </button>
                        </li>

                        <li class='nav-item'>
                            <button type='button'
                                    class='nav-link'
                                    data-bs-toggle='tab'
                                    data-bs-target='#admin'>
                                Admin
                            </button>
                        </li>
                    </ul>
                </div>

               <div class='card-body'>
                    <div class='tab-content'>
                        <div class='tab-pane fade show active' id='customer'>
                        <div class='welcome-text'>
                            <h2>Welcome back!</h2>
                            <p>Try our delicious food today.</p>
                        </div>
                            <form id='customerLoginForm'>
                                <div class='mb-3'>
                                    <label for='custEmail' class='form-label'>Email</label>
                                    <input type='email'
                                           id='custEmail'
                                           class='form-control'
                                           placeholder='Enter your email'
                                           required>
                                </div>

                                <div class='mb-4'>
                                    <label for='custPassword' class='form-label'>Password</label>
                                    <input type='password'
                                           id='custPassword'
                                           class='form-control'
                                           placeholder='Enter your password'
                                           required>
                                </div>

                                <div class='d-flex gap-2'>
                                    <button type='submit'
                                            class='btn btn-primary flex-fill'>
                                        Login
                                    </button>

                                    <button type='reset'
                                            class='btn btn-reset flex-fill'>
                                        Reset
                                    </button>
                                </div>

                                <div class='text-center mt-3'>
                                    New user?
                                    <a href='Register.html'>Register here</a>
                                </div>
                            </form>
                        </div>

                        <div class='tab-pane fade' id='admin'>
                            <form id='adminLoginForm'>
                                <div class='mb-3'>
                                    <label for='adminUser' class='form-label'>
                                        Admin username
                                    </label>

                                    <input type='text'
                                           id='adminUser'
                                           class='form-control'
                                           placeholder='Enter admin username'
                                           required>
                                </div>

                                <div class='mb-4'>
                                    <label for='adminPass' class='form-label'>
                                        Password
                                    </label>

                                    <input type='password'
                                           id='adminPass'
                                           class='form-control'
                                           placeholder='Enter your password'
                                           required>
                                </div>

                                <div class='d-flex gap-2'>
                                    <button type='submit'
                                            class='btn btn-primary flex-fill'>
                                        Login
                                    </button>

                                    <button type='reset'
                                            class='btn btn-reset flex-fill'>
                                        Reset
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>

            <div class='login-image'>
                <img src='images/food-login-right.jpg' alt='Restaurant food'>
            </div>

        </div>
    </main>

    <script src='https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js'></script>
    <script src='auth.js'></script>
</body>
</html>
