<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Admin Dashboard</title>
    <link href='https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css' rel='stylesheet'>
    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #f8f9fa 0%, #eef3ff 100%);
            font-family: Arial, sans-serif;
            padding: 40px 0;
        }

        .dashboard-container {
            max-width: 1100px;
            margin: 0 auto;
        }

        .section-card {
            border: none;
            border-radius: 18px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.08);
            overflow: hidden;
        }

        .card-header-primary {
            background: linear-gradient(135deg, #0d6efd, #0b5ed7);
            color: #fff;
            border-bottom: none;
            padding: 1.2rem 1.5rem;
        }

        .form-control, .form-select {
            border-radius: 10px;
            padding: 0.8rem 0.9rem;
            background: #f8f9fa;
            border: 1px solid #dfe3e8;
        }

        .form-control:focus {
            box-shadow: 0 0 0 0.2rem rgba(13, 110, 253, 0.12);
            border-color: #86b7fe;
            background: #fff;
        }

        .btn-primary {
            border-radius: 10px;
            font-weight: 600;
            padding: 0.72rem 1rem;
        }

        .food-row {
            border: 1px solid #e9ecef;
            background: #fff;
            border-radius: 12px;
            padding: 1rem 1.1rem;
            margin-bottom: 0.9rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
        }

        .food-list-image {
            width: 76px;
            height: 76px;
            object-fit: cover;
            border-radius: 10px;
            flex-shrink: 0;
        }

        .order-item {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 10px;
            padding: 0.85rem 1rem;
            margin-bottom: 0.75rem;
        }

        .btn-sm {
            border-radius: 8px;
            font-weight: 600;
        }

        .logout-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 2;
        }
    </style>
</head>
<body>
    <button class='btn btn-outline-danger logout-btn' id='logoutBtn'>Logout</button>

    <div class='container dashboard-container'>
        <div class='row g-4'>
            <div class='col-lg-7'>
                <div class='card section-card'>
                    <div class='card-header-primary'>
                        <h3 class='mb-0'>Add Food Item</h3>
                    </div>
                    <div class='card-body'>
                        <form id='addFoodForm'>
                            <div class='mb-3'>
                                <label for='foodname' class='form-label'>Food Name</label>
                                <input type='text' class='form-control' id='foodname' placeholder='Enter food name' required>
                            </div>
                            <div class='mb-3'>
                                <label for='price' class='form-label'>Price</label>
                                <input type='number' class='form-control' id='price' placeholder='Enter price' required>
                            </div>
                            <div class='mb-3'>
                                <label for='foodimage' class='form-label'>Food Image URL <span class='text-muted'>(optional)</span></label>
                                <input type='url' class='form-control' id='foodimage' placeholder='https://example.com/food.jpg'>
                            </div>
                            <button type='submit' class='btn btn-primary w-100'>Add</button>
                            <div id='foodMessage' class='alert alert-success mt-3 mb-0' role='alert' hidden>Food item added successfully!</div>
                        </form>
                    </div>
                </div>

                <div class='card section-card mt-4'>
                    <div class='card-header-primary'>
                        <h3 class='mb-0'>Food List</h3>
                    </div>
                    <div class='card-body'>
                        <div id='foodList'></div>
                        <div id='updateMessage' class='alert alert-success mt-3 mb-0' role='alert' hidden>Food item updated successfully!</div>
                        <div id='deleteMessage' class='alert alert-success mt-3 mb-0' role='alert' hidden>Food item deleted successfully!</div>
                    </div>
                </div>
            </div>

            <div class='col-lg-5'>
                <div class='card section-card'>
                    <div class='card-header bg-dark text-white'>
                        <h4 class='mb-0'>Orders</h4>
                    </div>
                    <div class='card-body'>
                        <ul id='orders' class='list-unstyled mb-0'></ul>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src='admin.js?v=2'></script>
</body>
</html>
